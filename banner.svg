<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .term-bg { fill: #0d1117; }
      .term-bar { fill: #161b22; }
      .title { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 13px; }
      .prompt { fill: #58a6ff; font-family: 'Courier New', monospace; font-size: 16px; }
      .cmd { fill: #c9d1d9; font-family: 'Courier New', monospace; font-size: 16px; }
      .out { fill: #7ee787; font-family: 'Courier New', monospace; font-size: 15px; }
      .comment { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 14px; }
      .metric { fill: #ffa657; font-family: 'Courier New', monospace; font-size: 15px; }
      .cursor { fill: #c9d1d9; }
    </style>
  </defs>

  <rect class="term-bg" width="900" height="320" rx="10"/>
  <rect class="term-bar" width="900" height="34" rx="10"/>
  <rect class="term-bar" y="20" width="900" height="14"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" class="title">anmol@github: ~/profile</text>

  <text x="24" y="66" class="prompt">$ <tspan class="cmd">whoami</tspan></text>
  <text x="24" y="90" class="out">Anmol Jain — SWE Trainee @ Bizom · Research Intern (GNNs for financial forecasting) @ NIT Rourkela</text>

  <text x="24" y="122" class="prompt">$ <tspan class="cmd">cat currently.log</tspan></text>
  <text x="24" y="146" class="comment"># building agentic pipelines, multi-tenant SaaS, and prepping for SDE-1 placements</text>

  <text x="24" y="178" class="prompt">$ <tspan class="cmd">git log --stat --oneline -4</tspan></text>
  <text x="24" y="202" class="metric">142,917</text><text x="120" y="202" class="comment">edges indexed in a codebase graph -&gt; agent never regenerates existing code</text>
  <text x="24" y="224" class="metric">30–45m → ~2m</text><text x="175" y="224" class="comment">per test case, agentic pipeline @ Bizom</text>
  <text x="24" y="246" class="metric">O(1)</text><text x="80" y="246" class="comment">permission lookups, replacing a recursive role-tree walk</text>
  <text x="24" y="268" class="metric">~80%</text><text x="90" y="268" class="comment">token reduction via dynamic LLM context selection</text>

  <text x="24" y="300" class="prompt">$ <tspan class="cursor">▊</tspan>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
</svg>
